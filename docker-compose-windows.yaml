# Windows / Docker Desktop (WSL2) — hardened host isolation while keeping
# full GPU / CPU / nested Docker / desktop apps working.
#
# Isolation applied:
#   - cgroup: private (NO cgroup: host)
#   - NO /sys/fs/cgroup host bind-mount  (avoids WSL ef53 systemd crash + host cgroup abuse)
#   - cap_drop: SYS_MODULE
#
# Still required for nested Docker + XFCE/Chrome/Electron desktop:
#   - privileged: true
#   - apparmor:unconfined (Ubuntu 26.04 GTK glycin/bwrap)
#   - seccomp:unconfined (Chromium/Electron)
#   - gpus: all
#   - no CPU/memory limits
#
# If systemd still fails on your WSL build, set CONTAINERWS_INIT=direct
# (cws+sshd still run; start dockerd manually or via Softwares scripts).
#
# Workspace / SSH / config use Docker named volumes (Linux ext4 inside the
# Docker Desktop VM) — NOT Windows C:\ bind mounts — so inotify works for
# air, Vite HMR, and git refresh inside the container.
services:
  containerws:
    container_name: containerws
    image: izetmolla/containerws:ubuntu-26.04
    hostname: containerws
    working_dir: /workspace
    restart: always
    tty: true
    stop_signal: SIGRTMIN+3
    # Avoid "exec /entrypoint.sh: no such file" from CRLF shebangs in older Hub images.
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

    privileged: true
    cgroup: private
    gpus: "all"
    shm_size: "2gb"
    deploy: {}
    tmpfs:
      - /run:exec,mode=755
      - /run/lock:mode=755
      - /tmp:exec,mode=1777
    environment:
      ENV: production
      container: docker
      CONTAINERWS_INIT: auto
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ROOT_PWD: ""
      ROOT_SSH_PUBLIC_KEY: ''
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    cap_drop:
      - SYS_MODULE
    volumes:
      - containerws-workspace:/workspace
      - containerws-ssh:/root/.ssh
      - containerws-config:/config
      - containerws-docker-data:/var/lib/docker
      # Intentionally NO /sys/fs/cgroup host bind-mount.
    networks:
      VLAN26:
        ipv4_address: 10.10.26.50

volumes:
  containerws-workspace:
    name: containerws-workspace
  containerws-ssh:
    name: containerws-ssh
  containerws-config:
    name: containerws-config
  containerws-docker-data:
    name: containerws-docker-data

networks:
  VLAN26:
    external: true
