services:
  containerwsdev:
    build:
      context: .
      dockerfile: docker/ubuntu/26.04/Dockerfile
    # image: izetmolla/containerws:ubuntu-24.10
    container_name: containerwsdev
    restart: unless-stopped
    privileged: true
    cgroup: host
    tty: true
    stop_signal: SIGRTMIN+3
    # Avoid "exec /entrypoint.sh: no such file" from CRLF shebangs in older images.
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - ./tmp/config:/config
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    environment:
      ENV: production
      container: docker
      ROOT_PWD: ""
      ROOT_SSH_PUBLIC_KEY: ""
    # Privileged for systemd, but drop module-loading — unsupported on WSL
    # and triggers: "Failed to initialize kmod context: Operation not supported".
    cap_drop:
      - SYS_MODULE
    networks:
      VLAN26:
        ipv4_address: 10.10.26.113

networks:
  VLAN26:
    external: true
