# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Binary-only release config (no Docker images).
# Inspired by https://github.com/filebrowser/filebrowser/.goreleaser.yml
version: 2

project_name: containerws

env:
  - GO111MODULE=on

before:
  hooks:
    # Quote the whole command — unquoted ": " in YAML is parsed as a map.
    - 'test -f frontend/static/index.html'

builds:
  - id: containerws
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/izetmolla/containerws/version.Version={{ .Version }} -X github.com/izetmolla/containerws/version.CommitSHA={{ .ShortCommit }}
    main: ./main.go
    binary: containerws
    goos:
      - darwin
      - linux
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
      - riscv64
    goarm:
      - "5"
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: riscv64
      # Experimental / unsupported by Go or pure-go sqlite (modernc)
      - goos: openbsd
        goarch: riscv64
      - goos: openbsd
        goarch: "386"
      - goos: openbsd
        goarch: arm
      # Broken as of Go 1.24, deprecated as of Go 1.26
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: riscv64
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: riscv64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: izetmolla
    name: containerws
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto
  mode: replace

# Publishes Casks/containerws.rb to izetmolla/homebrew-tap on each release.
# Requires HOMEBREW_TAP_TOKEN (PAT with contents:write on the tap). When unset,
# brew upload is skipped so the GitHub Release still publishes.
# Needs GoReleaser ≥2.10 (homebrew_casks; `brews` is deprecated).
homebrew_casks:
  - name: containerws
    ids:
      - default
    binaries:
      - containerws
    repository:
      owner: izetmolla
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/izetmolla/containerws"
    description: "Container Workspace — Linux workspace with web UI, Softwares catalog, and Cloud Shell"
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_TOKEN "" }}true{{ else }}auto{{ end }}'
    commit_msg_template: "Brew cask update for containerws {{ .Tag }}"
    caveats: |
      After install, create the `cws` CLI link and start the background daemon:

        sudo containerws setup

      This installs host dirs, links `cws`, and runs `cws --start` via systemd/launchd/direct.
      Web UI: http://127.0.0.1:9000
    hooks:
      post:
        install: |
          if OS.mac? && system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/containerws"]
          end
          bin = "#{staged_path}/containerws"
          setup_ok = false
          if File.executable?(bin) && File.exist?("/usr/bin/sudo")
            # Passwordless sudo only — otherwise print the manual step.
            result = system_command "/usr/bin/sudo", args: ["-n", bin, "setup"], print_stderr: false, must_succeed: false
            setup_ok = result.success?
          end
          if setup_ok
            ohai "Container Workspace daemon installed (cws --start). UI: http://127.0.0.1:9000"
          else
            ohai "Next step: run 'sudo containerws setup' to create the cws link and start the daemon"
          end
