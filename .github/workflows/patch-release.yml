name: Patch & Release

# Auto-release when a commit message contains "patch & release" (push to main/master).
# For manual releases from the Actions UI, prefer the "Release" workflow
# (bump-and-publish / publish-tag / snapshot).
#
# This workflow builds first, bumps patch, tags, pushes, then publishes with
# GoReleaser in the same job (GITHUB_TOKEN pushes do not re-trigger Release).

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump type
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: patch-and-release
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.x"
  NODE_VERSION: "24.x"

jobs:
  detect:
    name: Detect trigger
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      bump: ${{ steps.check.outputs.bump }}
    steps:
      - name: Decide whether to release
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BUMP: ${{ github.event.inputs.bump }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "bump=${DISPATCH_BUMP:-patch}" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — bump=${DISPATCH_BUMP:-patch}"
            exit 0
          fi

          if printf '%s' "$COMMIT_MSG" | grep -qiE 'patch[[:space:]]*&[[:space:]]*release'; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "bump=patch" >> "$GITHUB_OUTPUT"
            echo "Commit message matched 'patch & release'"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "bump=patch" >> "$GITHUB_OUTPUT"
            echo "No 'patch & release' in commit message — skipping"
          fi

  release:
    name: Build, tag & publish
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Preflight — frontend (typecheck, lint, build)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint
          pnpm run build
          test -f static/index.html

      - name: Preflight — backend (test + build)
        run: |
          go test ./...
          go build -o /tmp/containerws-preflight .
          rm -f /tmp/containerws-preflight

      - name: Preflight — GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~2.8"
          args: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version, changelog, tag & push
        id: bump
        env:
          BUMP: ${{ needs.detect.outputs.bump }}
        run: |
          set -euo pipefail
          chmod +x scripts/release.sh scripts/bump-version.sh
          ./scripts/release.sh "$BUMP" --yes --skip-build
          TAG="$(git describe --tags --abbrev=0 --match='v*')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Published git tag ${TAG}"

      - name: Publish GitHub Release (GoReleaser)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~2.8"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          {
            echo "## Patch & Release"
            echo
            echo "- **Tag:** \`${TAG}\`"
            echo "- **Commit:** ${{ github.sha }}"
            echo "- **Release:** https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
