name: Release

# Publishes binary GitHub Releases via GoReleaser.
#
# Triggers:
#   1. Push of a v* tag (e.g. from ./scripts/release.sh)
#   2. Manual "Run workflow" from the Actions tab (bump + tag + publish)
#   3. Optional snapshot dry-run from the Actions tab
#
# Manual modes (workflow_dispatch):
#   - bump-and-publish — preflight build, bump semver, push tag, publish release
#   - publish-tag      — publish an existing v* tag that has no release yet
#   - snapshot         — build only (no GitHub Release)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: What to do
        type: choice
        options:
          - bump-and-publish
          - publish-tag
          - snapshot
        default: bump-and-publish
      bump:
        description: Semver bump (bump-and-publish only)
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      tag:
        description: Existing tag to publish (publish-tag only), e.g. v0.1.0
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

env:
  # Aligned with filebrowser CI (Go 1.26.x / Node 24.x) and go.mod / frontend engines.
  GO_VERSION: "1.26.x"
  NODE_VERSION: "24.x"

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'bump-and-publish'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Resolve mode
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "mode=publish-tag" >> "$GITHUB_OUTPUT"
            echo "bump=" >> "$GITHUB_OUTPUT"
            echo "tag=${REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "do_bump=false" >> "$GITHUB_OUTPUT"
            echo "do_publish=true" >> "$GITHUB_OUTPUT"
            echo "do_snapshot=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MODE="${INPUT_MODE:-bump-and-publish}"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "bump=${INPUT_BUMP:-patch}" >> "$GITHUB_OUTPUT"
          echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"

          case "$MODE" in
            bump-and-publish)
              echo "do_bump=true" >> "$GITHUB_OUTPUT"
              echo "do_publish=true" >> "$GITHUB_OUTPUT"
              echo "do_snapshot=false" >> "$GITHUB_OUTPUT"
              ;;
            publish-tag)
              if [[ -z "${INPUT_TAG}" ]]; then
                echo "error: mode=publish-tag requires a tag input (e.g. v0.1.0)" >&2
                exit 1
              fi
              echo "do_bump=false" >> "$GITHUB_OUTPUT"
              echo "do_publish=true" >> "$GITHUB_OUTPUT"
              echo "do_snapshot=false" >> "$GITHUB_OUTPUT"
              ;;
            snapshot)
              echo "do_bump=false" >> "$GITHUB_OUTPUT"
              echo "do_publish=false" >> "$GITHUB_OUTPUT"
              echo "do_snapshot=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unknown mode: ${MODE}" >&2
              exit 1
              ;;
          esac

      - name: Preflight — frontend (typecheck, lint, build)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint
          pnpm run build
          test -f static/index.html

      - name: Preflight — backend (test + build)
        run: |
          go test ./...
          go build -o /tmp/containerws-preflight .
          rm -f /tmp/containerws-preflight

      - name: Preflight — GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~2.8"
          args: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version, changelog, tag & push
        id: bump
        if: steps.meta.outputs.do_bump == 'true'
        env:
          BUMP: ${{ steps.meta.outputs.bump }}
        run: |
          set -euo pipefail
          chmod +x scripts/release.sh scripts/bump-version.sh
          ./scripts/release.sh "$BUMP" --yes --skip-build
          TAG="$(git describe --tags --abbrev=0 --match='v*')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Created and pushed ${TAG}"

      - name: Checkout existing tag
        if: steps.meta.outputs.do_bump != 'true' && steps.meta.outputs.do_publish == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          git checkout "refs/tags/${TAG}"

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "${{ steps.meta.outputs.do_bump }}" == "true" ]]; then
            TAG="${{ steps.bump.outputs.tag }}"
          elif [[ -n "${{ steps.meta.outputs.tag }}" ]]; then
            TAG="${{ steps.meta.outputs.tag }}"
          else
            TAG="$(git describe --tags --abbrev=0 --match='v*' 2>/dev/null || true)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using tag: ${TAG:-none}"

      - name: Publish GitHub Release (GoReleaser)
        if: steps.meta.outputs.do_publish == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~2.8"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Snapshot build only (no publish)
        if: steps.meta.outputs.do_snapshot == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~2.8"
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          MODE: ${{ steps.meta.outputs.mode }}
        run: |
          {
            echo "## Release"
            echo
            echo "- **Mode:** \`${MODE}\`"
            echo "- **Tag:** \`${TAG:-n/a}\`"
            echo "- **Ref:** \`${{ github.ref }}\`"
            if [[ -n "${TAG}" && "${{ steps.meta.outputs.do_publish }}" == "true" ]]; then
              echo "- **Release:** https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
