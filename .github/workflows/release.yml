name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Always builds a snapshot locally (no GitHub Release). Tag pushes publish releases."
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Aligned with filebrowser CI (Go 1.26.x / Node 24.x) and go.mod / frontend engines.
  # See https://github.com/filebrowser/filebrowser/blob/master/.github/workflows/ci.yaml
  GO_VERSION: "1.26.x"
  NODE_VERSION: "24.x"

jobs:
  release:
    name: Build & publish binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend (embedded into binary)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          test -f static/index.html

      - name: Run GoReleaser (snapshot, no publish)
        if: github.event_name == 'workflow_dispatch'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~2.8"
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser (publish GitHub Release)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~2.8"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
