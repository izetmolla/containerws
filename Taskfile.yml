version: "3"

vars:
  BIN: containerws
  GO_PACKAGE: github.com/izetmolla/containerws

tasks:
  build:frontend:
    desc: Build frontend assets into frontend/static (embedded by Go)
    dir: frontend
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm run build

  build:backend:
    desc: Build backend binary with version ldflags
    cmds:
      - >
        go build -ldflags='-s -w
        -X "{{.GO_PACKAGE}}/version.Version={{.VERSION}}"
        -X "{{.GO_PACKAGE}}/version.CommitSHA={{.GIT_COMMIT}}"'
        -o {{.BIN}} .
    vars:
      GIT_COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
      VERSION:
        sh: |
          git describe --tags --abbrev=0 --match='v*' 2>/dev/null | sed 's/^v//' || echo "0.0.0-dev"

  build:
    desc: Build frontend then backend
    cmds:
      - task: build:frontend
      - task: build:backend

  release:dry-run:
    desc: Preview next version bump (does not write)
    cmds:
      - ./scripts/bump-version.sh --dry-run {{.CLI_ARGS}}

  release:patch:
    desc: Preflight build, bump patch, tag, and push (no binary publish — use release:local)
    cmds:
      - ./scripts/release.sh patch

  release:minor:
    desc: Preflight build, bump minor, tag, and push (no binary publish — use release:local)
    cmds:
      - ./scripts/release.sh minor

  release:major:
    desc: Preflight build, bump major, tag, and push (no binary publish — use release:local)
    cmds:
      - ./scripts/release.sh major

  release:tag:
    desc: Preflight build, create exact tag vX.Y.Z, and push (e.g. task release:tag -- v0.2.0)
    cmds:
      - ./scripts/release.sh {{.CLI_ARGS}}

  release:local:
    desc: Local GoReleaser + GitHub Release + Homebrew tap over SSH (e.g. task release:local -- patch --yes)
    cmds:
      - ./scripts/release-local.sh {{.CLI_ARGS}}

  release:brew:
    desc: Push dist/homebrew cask to izetmolla/homebrew-tap over SSH (e.g. task release:brew -- v0.1.3)
    cmds:
      - ./scripts/publish-homebrew-tap.sh {{.CLI_ARGS}}

  goreleaser:snapshot:
    desc: Local GoReleaser snapshot (binaries only, no publish)
    cmds:
      - task: build:frontend
      - goreleaser release --snapshot --clean --skip=publish

  goreleaser:check:
    desc: Validate .goreleaser.yml
    cmds:
      - goreleaser check

  docs:start:
    desc: Start Docusaurus docs site (http://localhost:3000)
    dir: docs
    cmds:
      - pnpm install
      - pnpm start

  docs:build:
    desc: Build Docusaurus docs site
    dir: docs
    cmds:
      - pnpm install
      - pnpm build
